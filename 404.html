<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ページが見つかりません｜Yume Spa</title>
  <meta name="theme-color" content="#2B2434">
  <link rel="icon" href="/assets/img/icon-32.png" sizes="32x32">
  <style>
    :root { --night: #2B2434; --night-deep: #1F1A27; --gold: #C8A04A; --gold-light: #E7D08A; --silk: #F8F4EC; }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0; display: grid; place-items: center; padding: 2rem 1.25rem;
      background: linear-gradient(160deg, var(--night), var(--night-deep)); color: var(--silk);
      font-family: "Noto Sans", "Noto Sans JP", "Hiragino Sans", "Yu Gothic", system-ui, sans-serif;
      line-height: 1.8; text-align: center;
    }
    main { max-width: 32rem; }
    img { width: 64px; height: auto; }
    h1 { margin: 1.25rem 0 .5rem; font-family: "Hiragino Mincho ProN", "Yu Mincho", serif; font-weight: 500; font-size: 1.5rem; color: var(--gold-light); }
    p { margin: .35rem 0; opacity: .88; }
    nav { margin-top: 1.75rem; display: flex; flex-wrap: wrap; gap: .75rem; justify-content: center; }
    a {
      display: inline-block; min-width: 9.5rem; padding: .8rem 1.25rem; border: 1px solid var(--gold);
      border-radius: 999px; color: var(--gold-light); text-decoration: none;
    }
    a:hover, a:focus-visible { background: var(--gold); color: var(--night-deep); outline: none; }
  </style>
</head>
<body>
  <main>
    <img src="/assets/img/icon-gold.svg" alt="Yume Spa" width="64" height="56">
    <h1>ページが見つかりません</h1>
    <p lang="vi">Không tìm thấy trang này.</p>
    <p lang="en">This page could not be found.</p>
    <nav aria-label="Yume Spa">
      <a href="/" lang="ja" hreflang="ja">日本語のトップへ</a>
      <a href="/vi/" lang="vi" hreflang="vi">Trang tiếng Việt</a>
      <a href="/en/" lang="en" hreflang="en">English page</a>
    </nav>
  </main>
</body>
</html>
