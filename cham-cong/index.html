<!DOCTYPE html>
<html lang="ja">
<head>
<meta name="robots" content="noindex,nofollow">
<base target="_top">
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f7f3f0;--card:#fff;--ink:#2a2421;--mute:#857a73;--line:#ece3dd;--rose:#c9738a;--rose-2:#f6e4e9;--ok:#2e7d55;--ok-2:#e3f2ea;--warn:#b7791f;--warn-2:#fbf0dc;--bad:#b3392f;--bad-2:#f8e3e1;--r:18px;
        --font:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;--font-ja:"Noto Sans JP","Hiragino Sans","Yu Gothic UI",system-ui,sans-serif}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-user-select:none;user-select:none;overflow:hidden}
  html[lang=ja] body{font-family:var(--font-ja)}
  .app{height:100%;display:flex;flex-direction:column;max-width:1100px;margin:0 auto;padding:20px 28px}
  header{display:flex;align-items:center;justify-content:space-between;gap:16px}
  .brand{display:flex;align-items:center;gap:12px}
  .logo{width:44px;height:44px;border-radius:12px;background:var(--rose);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
  .brand b{font-size:19px;font-weight:700;display:block;line-height:1.2}.brand span{color:var(--mute);font-size:13px}
  .seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px}
  .seg button{border:0;background:none;font:500 14px var(--font);padding:8px 12px;border-radius:9px;color:var(--mute);cursor:pointer}
  .seg button.on{background:var(--ink);color:#fff}
  .clock{text-align:center;margin:18px 0 6px}
  .clock .t{font-size:72px;font-weight:600;letter-spacing:-1px;font-variant-numeric:tabular-nums;line-height:1}
  .clock .d{color:var(--mute);margin-top:6px}
  main{flex:1;overflow:auto;padding:14px 2px 6px}
  h2{font-size:15px;font-weight:600;color:var(--mute);margin:8px 0 12px;text-transform:none}
  .staff{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .person{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 14px;text-align:center;cursor:pointer;transition:transform .08s,box-shadow .15s}
  .person:active{transform:scale(.97)}
  .person:hover{box-shadow:0 6px 18px rgba(42,36,33,.07)}
  .av{width:64px;height:64px;border-radius:50%;margin:0 auto 10px;display:grid;place-items:center;font-size:24px;font-weight:600;color:#fff}
  .person .n{font-weight:600;font-size:17px}
  .chip{display:inline-flex;align-items:center;gap:6px;margin-top:8px;font-size:12.5px;font-weight:500;padding:4px 10px;border-radius:999px;background:#f1ebe7;color:var(--mute)}
  .chip i{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
  .chip.in{background:var(--ok-2);color:var(--ok)}.chip.brk{background:var(--warn-2);color:var(--warn)}
  footer{display:flex;justify-content:space-between;align-items:center;color:var(--mute);font-size:13px;padding-top:10px}
  .ghost{border:1px solid var(--line);background:#fff;border-radius:10px;padding:8px 14px;font:500 14px var(--font);color:var(--mute);cursor:pointer}
  /* lớp phủ */
  .sheet{position:fixed;inset:0;background:rgba(42,36,33,.42);display:none;align-items:center;justify-content:center;padding:20px;z-index:10}
  .sheet.on{display:flex}
  .panel{background:var(--card);border-radius:24px;width:min(460px,100%);padding:26px;box-shadow:0 24px 60px rgba(0,0,0,.2);position:relative}
  .panel.wide{width:min(860px,100%);max-height:92vh;overflow:auto}
  .x{position:absolute;right:16px;top:14px;border:0;background:#f4eee9;width:36px;height:36px;border-radius:50%;font-size:18px;color:var(--mute);cursor:pointer}
  .who{display:flex;align-items:center;gap:14px;margin-bottom:18px}
  .who .av{margin:0;width:52px;height:52px;font-size:20px}
  .who b{font-size:20px;display:block}.who span{color:var(--mute);font-size:14px}
  .dots{display:flex;justify-content:center;gap:16px;margin:6px 0 18px}
  .dots i{width:16px;height:16px;border-radius:50%;border:2px solid #cfc3bb}
  .dots i.f{background:var(--ink);border-color:var(--ink)}
  .dots.shake{animation:sh .35s}
  @keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{height:64px;border-radius:16px;border:1px solid var(--line);background:#fbf8f6;font:500 26px var(--font);color:var(--ink);cursor:pointer}
  .pad button:active{background:#efe7e2}
  .pad .fn{font-size:15px;color:var(--mute)}
  .cam{display:flex;flex-direction:column;align-items:center;gap:8px;margin:14px 0 4px}
  .cam video,.cam img{width:100%;max-width:340px;aspect-ratio:4/3;object-fit:cover;border-radius:16px;background:#f1ebe7;transform:scaleX(-1)}
  .cam .s{font-size:13.5px;color:var(--mute);text-align:center}
  .cam label{font-weight:600;color:var(--rose);cursor:pointer}
  .acts{display:grid;gap:10px;margin-top:16px}
  .acts button{height:62px;border-radius:16px;border:0;font:600 18px var(--font);cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
  .a-in{background:var(--ok);color:#fff}.a-out{background:var(--ink);color:#fff}.a-brk{background:var(--warn-2);color:var(--warn)}.a-back{background:var(--ok-2);color:var(--ok)}
  .acts button:disabled{opacity:.5}
  .err{color:var(--bad);text-align:center;font-weight:500;min-height:24px;margin-top:10px}
  .done{text-align:center;padding:12px 6px}
  .done .ic{width:84px;height:84px;border-radius:50%;margin:0 auto 14px;display:grid;place-items:center;font-size:42px;color:#fff;background:var(--ok)}
  .done .ic.out{background:var(--ink)}.done .ic.brk{background:var(--warn)}
  .done h3{font-size:24px;margin:0 0 4px}.done .tm{font-size:44px;font-weight:600;font-variant-numeric:tabular-nums}
  .done .sub{color:var(--mute);margin-top:6px}.done .w{margin-top:12px;background:var(--warn-2);color:var(--warn);border-radius:12px;padding:10px;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:14.5px}
  th{text-align:left;color:var(--mute);font-weight:500;padding:8px;border-bottom:1px solid var(--line)}
  td{padding:9px 8px;border-bottom:1px solid #f3ede9}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .box{border:1px solid var(--line);border-radius:16px;padding:14px}
  .box h4{margin:0 0 8px;font-size:15px}
  .fx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .fx select,.fx input{font:400 15px var(--font);padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;-webkit-user-select:text;user-select:text}
  .fx .full{grid-column:1/-1}
  .btn{height:46px;border:0;border-radius:12px;background:var(--ink);color:#fff;font:600 15px var(--font);cursor:pointer}
  .empty{color:var(--mute);font-size:14px;padding:10px 0}
  .staff .empty{grid-column:1/-1;font-size:16px;padding:18px;border:1px dashed var(--line);border-radius:14px;text-align:center}
  @media (max-width:700px){.clock .t{font-size:52px}.grid2{grid-template-columns:1fr}.app{padding:14px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand"><div class="logo">Y</div><div><b>Yume Spa</b><span data-t="sub"></span></div></div>
    <div class="seg" id="lang"><button data-l="ja">日本語</button><button data-l="vi">Tiếng Việt</button><button data-l="en">English</button></div>
  </header>
  <div class="clock"><div class="t" id="clk">--:--</div><div class="d" id="day"></div></div>
  <main><h2 data-t="tap"></h2><div class="staff" id="staff"></div></main>
  <footer><span id="foot"></span><button class="ghost" id="mgrBtn" data-t="mgr"></button></footer>
</div>

<div class="sheet" id="sPin"><div class="panel">
  <button class="x" data-close>×</button>
  <div class="who" id="pinWho"></div>
  <div class="dots" id="dots"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <div class="err" id="pinErr"></div>
</div></div>

<div class="sheet" id="sAct"><div class="panel">
  <button class="x" data-close>×</button>
  <div class="who" id="actWho"></div>
  <div class="cam"><video id="vid" playsinline muted hidden></video><img id="shot" alt="" hidden><div class="s" id="camTxt"></div><label for="camIn" id="camLbl" hidden></label></div>
  <input id="camIn" type="file" accept="image/*" capture="user" hidden>
  <div class="acts" id="acts"></div>
  <div class="err" id="actErr"></div>
</div></div>

<div class="sheet" id="sDone"><div class="panel"><div class="done" id="doneBox"></div></div></div>

<div class="sheet" id="sMgr"><div class="panel wide">
  <button class="x" data-close>×</button>
  <div id="mgrBox"></div>
</div></div>

function showActions(){
  const [c] = status(sel.code), o = st.open[sel.code];
  $("#actWho").innerHTML = whoHtml(sel, status(sel.code)[1]);
  const b = (k, cls) => `<button class="${cls}" data-a="${k}">${t({"VÀO CA":"in","NGHỈ":"brk","TRỞ LẠI":"back","RA CA":"out"}[k])}</button>`;
  $("#acts").innerHTML = !o ? b("VÀO CA","a-in") : o.nghi ? b("TRỞ LẠI","a-back") + b("RA CA","a-out") : b("NGHỈ","a-brk") + b("RA CA","a-out");
  $("#actErr").textContent = ""; open("sAct"); startCam();
}
async function startCam(){
  photo = ""; $("#shot").hidden = true; $("#camLbl").hidden = true;
  try { stream = await navigator.mediaDevices.getUserMedia({video:{facingMode:"user", width:640}}); const v = $("#vid"); v.srcObject = stream; v.hidden = false; await v.play(); $("#camTxt").textContent = t("cam"); }
  catch(e){ $("#vid").hidden = true; $("#camTxt").textContent = t("camNo"); $("#camLbl").textContent = t("camBtn"); $("#camLbl").hidden = false; }
}
function stopCam(){ if (stream) { stream.getTracks().forEach(x => x.stop()); stream = null; } }
function snap(){ const v = $("#vid"); if (!stream || !v.videoWidth) return photo;
  const c = document.createElement("canvas"), k = Math.min(1, 720 / v.videoWidth); c.width = v.videoWidth * k; c.height = v.videoHeight * k;
  c.getContext("2d").drawImage(v, 0, 0, c.width, c.height); return c.toDataURL("image/jpeg", .72); }
function doPunch(type, btn){
  const img = photo || snap(), key = sel.code + "|" + type;
  if (!pending || pending.key !== key) pending = {key, id: Date.now().toString(36) + Math.random().toString(36).slice(2, 8)};
  document.querySelectorAll("#acts button").forEach(x => x.disabled = true); $("#actErr").textContent = t("saving");
  google.script.run.withSuccessHandler(r => {
      document.querySelectorAll("#acts button").forEach(x => x.disabled = false);
      if (!r.ok) { $("#actErr").textContent = t("e_" + r.err) || r.err; if (r.err === "bad_pin") { startPin("staff"); $("#pinErr").textContent = t("e_bad_pin"); } return; }
      stopCam(); const k = {"VÀO CA":["in","✓","ok_in"],"NGHỈ":["brk","☕","ok_brk"],"TRỞ LẠI":["in","↩","ok_back"],"RA CA":["out","✓","ok_out"]}[type];
      $("#doneBox").innerHTML = `<div class="ic ${k[0]}">${k[1]}</div><h3>${esc(sel.name || sel.code)} · ${esc(t("TY")[type])}</h3><div class="tm">${esc(r.time)}</div><div class="sub">${t(k[2])}</div>`
        + (r.hours !== "" && r.hours != null ? `<div class="sub">${t("hrs")}: <b>${r.hours}</b>${r.month !== "" && r.month != null ? ` · ${t("mon")}: <b>${Math.round(r.month * 10) / 10}</b>` : ""}</div>` : "")
        + (r.gh && r.gh.muc ? (r.gh.muc === "ĐỎ" ? `<div class="w" style="background:#fde2e2;color:#a11">⛔ ${t(r.gh.tuan === 0 ? "ghHs" : "ghVuot")}</div>`
            : r.gh.muc === "CHƯA RÕ" ? `<div class="w">⚠ ${t("ghHs")}</div>`
            : type !== "RA CA" ? `<div class="sub" style="${r.gh.muc === "VÀNG" ? "color:var(--warn);font-weight:600" : ""}">${t("ghCon")} <b>${r.gh.con}</b> ${t("ghH")}</div>` : "") : "")
        + (r.warn ? `<div class="w">⚠ ${esc(r.warn)}</div>` : "");
      open("sDone"); pending = null; load(); setTimeout(closeAll, r.warn || (r.gh && r.gh.muc !== "XANH") ? 8000 : 3500);
    }).withFailureHandler(() => { document.querySelectorAll("#acts button").forEach(x => x.disabled = false); $("#actErr").textContent = t("e_net"); })
    .punch(KEY, sel.code, pin, type, img, navigator.userAgent.slice(0, 60), pending.id);
}
function loadMgr(){
  $("#pinErr").textContent = t("saving");
  google.script.run.withSuccessHandler(r => {
    if (!r.ok) { mcode = ""; bad("e_" + r.err); return; }
    const ty = x => esc(t("TY")[x] || x);
    const opts = Object.keys(r.names).map(c => `<option value="${esc(c)}">${esc(r.names[c])} (${esc(c)})</option>`).join("");
    const openRows = Object.keys(r.open).map(c => `<tr><td>${esc(r.names[c] || c)}</td><td class="num">${esc(r.open[c].vao)}</td><td>${r.open[c].nghi ? t("onb") : t("on")}</td></tr>`).join("");
    $("#mgrBox").innerHTML = `<div class="who"><div class="av" style="background:var(--ink)">⚙</div><div><b>${t("mgr")}</b><span>${esc(r.month)}</span></div></div>
      <div class="grid2">
        <div class="box"><h4>${t("inNow")}</h4>${openRows ? `<table><tbody>${openRows}</tbody></table>` : `<div class="empty">${t("none")}</div>`}</div>
        <div class="box"><h4>${t("month")}</h4>${r.totals.length ? `<table><thead><tr><th>${t("person")}</th><th class="num">${t("h")}</th><th class="num">${t("ca")}</th><th class="num">${t("over")}</th><th class="num">${t("night")}</th></tr></thead><tbody>${r.totals.map(x => `<tr><td>${esc(x.name)}</td><td class="num">${Math.round((+x.h||0)*10)/10}</td><td class="num">${esc(x.ca)}</td><td class="num">${Math.round((+x.over8||0)*10)/10}</td><td class="num">${Math.round((+x.night||0)*10)/10}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">${t("none")}</div>`}</div>
      </div>
      <div class="box" style="margin-top:18px"><h4>${t("ghTit")}</h4>${(r.limits || []).length ? `<table><thead><tr><th>${t("person")}</th><th class="num">${t("ghLim")}</th><th class="num">${t("ghDa")}</th><th class="num">${t("ghConT")}</th><th>${t("ghTt")}</th><th>${t("ghLd")}</th></tr></thead><tbody>${r.limits.map(x => `<tr><td>${esc(x.name)}</td><td class="num">${x.gioi_han_tuan} (${t(x.kieu === "cuon" ? "ghK7" : "ghKt")})</td><td class="num">${x.da_tuan}</td><td class="num">${x.con}</td><td style="font-weight:600;color:${x.muc === "ĐỎ" ? "var(--bad)" : x.muc === "VÀNG" || x.muc === "CHƯA RÕ" ? "var(--warn)" : "var(--ok)"}">${esc(x.muc)}</td><td style="font-size:13px">${esc(x.ly_do)}${x.the ? " · " + esc(x.the) : ""}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">${t("none")}</div>`}</div>
      <div class="box" style="margin-top:18px"><h4>${t("today")}</h4>${r.today.length ? `<table><thead><tr><th>${t("time")}</th><th>${t("person")}</th><th>${t("type")}</th><th class="num">${t("h")}</th><th></th></tr></thead><tbody>${r.today.map(x => `<tr><td class="num">${esc(x.t)}</td><td>${esc(x.name)}</td><td>${ty(x.type)}</td><td class="num">${x.h === "" ? "" : esc(x.h)}</td><td style="color:var(--warn);font-size:13px">${esc(x.warn)}</td></tr>`).join("")}</tbody></table>` : `<div class="empty">${t("none")}</div>`}</div>
      <div class="box" style="margin-top:18px"><h4>${t("fix")}</h4><div class="fx">
        <select id="fxNv">${opts}</select><input id="fxM" value="${esc(r.month)}" placeholder="${t("fixMonth")}">
        <input id="fxH" inputmode="decimal" placeholder="${t("fixH")}"><input id="fxR" placeholder="${t("fixR")}">
        <button class="btn full" id="fxSave">${t("save")}</button><div class="err full" id="fxMsg"></div></div></div>
      <div style="text-align:right;margin-top:14px"><button class="ghost" data-close>${t("lock")}</button></div>`;
    open("sMgr");
  }).withFailureHandler(() => bad("e_net")).manager(KEY, mcode, "view", null);
}
document.addEventListener("click", e => {
  poke();
  const l = e.target.closest("#lang [data-l]"); if (l) { lang = l.dataset.l; paint(); tick(); return; }
  if (e.target.closest("[data-close]")) { closeAll(); return; }
  const p = e.target.closest(".person"); if (p) { sel = st.staff.find(x => x.code === p.dataset.nv); if (st.requirePin) startPin("staff"); else { pin = ""; showActions(); } return; }
  if (e.target.closest("#mgrBtn")) { startPin("mgr"); return; }
  const k = e.target.closest("#pad [data-k]"); if (k) {
    const v = k.dataset.k; $("#pinErr").textContent = "";
    if (v === "b") pin = pin.slice(0, -1); else if (v === "c") pin = ""; else if (pin.length < 4) pin += v;
    dots(pin.length); if (pin.length === 4) setTimeout(pinDone, 120); return; }
  const a = e.target.closest("#acts [data-a]"); if (a) { doPunch(a.dataset.a, a); return; }
  if (e.target.closest("#fxSave")) {
    const d = {nv: $("#fxNv").value, month: $("#fxM").value.trim(), delta: parseFloat(String($("#fxH").value).replace(",", ".").replace("−", "-")), reason: $("#fxR").value.trim()};
    $("#fxMsg").textContent = t("saving");
    google.script.run.withSuccessHandler(r => { $("#fxMsg").textContent = r.ok ? t("saved") : t("e_" + r.err); if (r.ok) { $("#fxH").value = ""; $("#fxR").value = ""; } })
      .withFailureHandler(() => $("#fxMsg").textContent = t("e_net")).manager(KEY, mcode, "fix", d);
  }
});
$("#camIn").addEventListener("change", ev => {
  const f = ev.target.files[0]; if (!f) return; const img = new Image();
  img.onload = () => { const k = Math.min(1, 720 / Math.max(img.width, img.height)), c = document.createElement("canvas");
    c.width = img.width * k; c.height = img.height * k; c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    photo = c.toDataURL("image/jpeg", .72); $("#shot").src = photo; $("#shot").hidden = false; $("#camTxt").textContent = t("camOk"); URL.revokeObjectURL(img.src); };
  img.src = URL.createObjectURL(f); ev.target.value = "";
});
paint(); tick(); setInterval(tick, 1000); load(); setInterval(load, 60000);
</script>
</body>
</html>
